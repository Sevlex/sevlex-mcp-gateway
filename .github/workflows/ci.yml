name: Sevlex Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-gateway:
    name: Gateway & Security Engine Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install Gateway Dependencies
        working-directory: ./gateway
        run: npm ci

      - name: Strict TypeScript Compilation (Gateway)
        working-directory: ./gateway
        run: npx tsc --noEmit

      - name: Run Live E2E Security Simulation Suite
        working-directory: ./gateway
        run: npm run simulate

      - name: Verify Cryptographic Merkle Hash Chain (SOC 2 Non-Repudiation)
        working-directory: ./gateway
        run: node bin/sevlex.js verify

      - name: Verify Gateway CLI Status Diagnostics
        working-directory: ./gateway
        run: node bin/sevlex.js status

  verify-dashboard:
    name: Dashboard & Health Probes Verification
    runs-on: ubuntu-latest
    needs: verify-gateway

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Strict TypeScript Compilation (Dashboard)
        working-directory: ./dashboard
        run: npx tsc --noEmit

      - name: Production Next.js Build
        working-directory: ./dashboard
        env:
          ADMIN_API_KEY: ci_test_secret_key
        run: npm run build
