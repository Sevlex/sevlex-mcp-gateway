name: Sevlex Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-gateway:
    name: Gateway & Security Engine Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm rebuild better-sqlite3

      - name: Strict TypeScript Compilation (Gateway)
        working-directory: ./gateway
        run: npx tsc --noEmit

      - name: Run Live E2E Security Simulation Suite
        working-directory: ./gateway
        run: npm run simulate

      - name: Verify Cryptographic Merkle Hash Chain (Tamper-Evident Non-Repudiation)
        working-directory: ./gateway
        run: node bin/sevlex.js verify

      - name: Verify Gateway CLI Status Diagnostics
        working-directory: ./gateway
        run: node bin/sevlex.js status

  verify-dashboard:
    name: Dashboard & Health Probes Verification
    runs-on: ubuntu-latest
    needs: verify-gateway

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm install --include=optional
          npm rebuild better-sqlite3
          npm install --prefix dashboard lightningcss-linux-x64-gnu --save-optional

      - name: Strict TypeScript Compilation (Dashboard)
        working-directory: ./dashboard
        run: npx tsc --noEmit

      - name: Production Next.js Build
        working-directory: ./dashboard
        env:
          ADMIN_API_KEY: ci_test_secret_key
        run: npm run build
